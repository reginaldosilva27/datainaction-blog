name: Deploy site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild diário: revela posts agendados (publishAt) quando a data chega,
  # mesmo sem push. Posts agendam pra 06:00 BRT; o deploy das 09:00 UTC
  # (≈06:00 BRT) publica o post do dia, e o das 12:00 UTC (≈09:00 BRT) é
  # rede de segurança caso o cron da manhã atrase.
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 12 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Astro
        uses: withastro/action@v3
        with:
          path: site # projeto Astro fica na subpasta site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
